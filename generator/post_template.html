<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
:root{--ink:#111111;--cream:#FFF4E0;--yellow:#FFD23F;--pink:#FF7EB6;--lime:#B8F35A;--blue:#7CC4FF;--orange:#FF9F45;--red:#FF5C5C;--green:#2FD180;--violet:#B79BFF;
  --head:'Bricolage Grotesque',sans-serif;--text:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;--sh:7px 7px 0 #111}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden}
#s{position:relative;width:1080px;height:1080px;overflow:hidden;color:var(--ink);font-family:var(--text);background:var(--cream)}
#s.grid:before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(17,17,17,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(17,17,17,.06) 2px,transparent 2px);background-size:54px 54px}
.bgn{position:absolute;right:-30px;bottom:-120px;font:800 520px/1 var(--head);color:transparent;-webkit-text-stroke:4px rgba(17,17,17,.07);letter-spacing:-20px}
.tag{position:absolute;left:64px;top:52px;font:800 24px var(--mono);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;letter-spacing:.04em}
.tag b{color:var(--yellow);background:none;padding:0}
.pgn{position:absolute;right:64px;top:44px;width:74px;height:74px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 #111;font:800 26px/66px var(--head);text-align:center}
.dots{position:absolute;left:64px;bottom:58px;display:flex;gap:10px}
.hdl{position:absolute;left:0;right:0;bottom:50px;text-align:center;font:800 26px var(--mono);letter-spacing:.02em;color:var(--ink);opacity:.6;pointer-events:none}
#s.iv .hdl{color:#fff;opacity:.75}
.dots i{width:14px;height:14px;border-radius:7px;background:rgba(17,17,17,.22)}
.dots i.on{width:46px;background:var(--ink)}
.swipe{position:absolute;right:64px;bottom:40px;font:800 28px var(--head);background:var(--ink);color:#fff;padding:12px 24px;border-radius:999px;transform:rotate(-3deg)}
.title{position:absolute;left:64px;right:180px;top:140px;font:800 66px/1.04 var(--head);letter-spacing:-1px}
.mk{position:relative;z-index:0;white-space:nowrap}
.mk:after{content:'';position:absolute;left:-6px;right:-6px;bottom:4px;height:42%;background:var(--acc,var(--yellow));z-index:-1;transform:skew(-8deg) rotate(-1deg);border-radius:6px}
.body{position:absolute;left:64px;right:64px;top:300px;bottom:130px;display:flex;flex-direction:column;justify-content:center;gap:24px;overflow:hidden;padding:4px 10px 12px 4px}
.pt{display:flex;gap:20px;align-items:center;background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:var(--sh);padding:20px 24px;font:700 34px/1.25 var(--text)}
.pt .n{flex:none;width:54px;height:54px;border-radius:16px;border:3px solid var(--ink);font:800 28px/48px var(--head);text-align:center}
b{font-weight:800;background:linear-gradient(transparent 58%,var(--acc,#FFD23F) 58%);padding:0 2px}
.bub{align-self:flex-start;position:relative;max-width:92%;background:var(--ink);color:#fff;border-radius:26px 26px 26px 6px;padding:20px 28px;font:700 30px/1.35 var(--text);transform:rotate(-1deg)}
.bub b{background:none;color:var(--yellow)}
.bub .who{display:block;font:800 22px var(--mono);color:var(--lime);margin-bottom:6px;letter-spacing:.04em}
.win{background:#16161D;border:4px solid var(--ink);border-radius:22px;box-shadow:var(--sh);overflow:hidden}
.body>*{flex-shrink:0}
.win .bar{height:52px;background:#26262F;display:flex;align-items:center;gap:10px;padding:0 20px}
.win .bar i{width:16px;height:16px;border-radius:50%}
.win .bar span{margin-left:14px;font:700 20px var(--mono);color:#9A9AB0}
.code{padding:24px 30px;font:500 31px/1.5 var(--mono);font-variant-ligatures:none;white-space:pre;color:#F4F4F8;overflow:hidden}
.k{color:#FF7EB6;font-weight:700}.s{color:#B8F35A}.nm{color:#FFD23F}.c{color:#8A8AA0;font-style:italic}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:var(--sh);overflow:hidden}
th{background:var(--ink);color:var(--yellow);font:800 22px var(--mono);letter-spacing:.06em;text-align:left;padding:16px 24px}
td{font:700 32px var(--text);padding:14px 24px;border-top:3px solid rgba(17,17,17,.12)}
tr.hl td{background:var(--acc,var(--yellow))}
.cmp{display:flex;gap:26px;position:relative}
.col{flex:1;border:4px solid var(--ink);border-radius:24px;box-shadow:var(--sh);padding:26px;display:flex;flex-direction:column;gap:14px}
.col h3{font:800 40px var(--head)}
.col p{font:700 29px/1.3 var(--text);padding-left:30px;position:relative}
.col p:before{content:'→';position:absolute;left:0}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);width:86px;height:86px;border-radius:50%;background:var(--ink);color:var(--yellow);font:800 32px/86px var(--head);text-align:center;border:4px solid #fff}
.box{border:4px solid var(--ink);border-radius:24px;box-shadow:var(--sh);padding:22px 26px;font:700 32px/1.35 var(--text)}
.box .lb{display:inline-block;font:800 24px var(--mono);letter-spacing:.06em;padding:6px 14px;border-radius:10px;border:3px solid var(--ink);margin-bottom:12px}
.box.bad{background:#FFC9C9;transform:rotate(-1.2deg)} .box.bad .lb{background:var(--red);color:#fff}
.box.good{background:#C8F5DC;transform:rotate(.8deg)} .box.good .lb{background:var(--green);color:#111}
.box .code{padding:0;color:#111;font-size:28px;line-height:1.45}
.box .code .k{color:#C2185B}.box .code .s{color:#2E7D32}.box .code .nm{color:#B8860B}
.chk{display:flex;gap:20px;align-items:center;background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:var(--sh);padding:18px 24px;font:700 33px/1.25 var(--text)}
.chk .bx{flex:none;width:50px;height:50px;border-radius:12px;background:var(--green);border:3px solid var(--ink);font:800 32px/44px var(--head);text-align:center}
.nxt{align-self:flex-start;margin-top:8px;background:var(--ink);color:#fff;border-radius:999px;padding:18px 32px;font:800 34px var(--head)}
.nxt span{color:var(--yellow)}
.stk{position:absolute;font:800 30px var(--head);background:#fff;border:4px solid var(--ink);border-radius:18px;padding:10px 18px;box-shadow:4px 4px 0 #111;white-space:nowrap}
.emo{position:absolute;font-size:96px;line-height:1;filter:drop-shadow(4px 4px 0 rgba(17,17,17,.9))}
.cv .mod{position:absolute;left:64px;top:150px;font:800 26px var(--mono);letter-spacing:.06em;background:#fff;border:4px solid var(--ink);padding:8px 18px;border-radius:12px;box-shadow:4px 4px 0 #111;transform:rotate(-2deg)}
.cv .hk{position:absolute;left:64px;right:150px;top:240px;bottom:300px;font:800 116px/0.98 var(--head);letter-spacing:-2px;overflow:hidden}
.cv .hk .mk:after{background:#fff;height:46%}
.cv .tp{position:absolute;left:64px;bottom:170px;display:flex;align-items:center;gap:18px;font:700 28px var(--text)}
#s.ivx b{background:linear-gradient(transparent 58%,#FFD23F 58%)}
#s.ivx .bub b{background:none;color:#FFD23F}
#s.ivx .tag b{background:none}
#s.iv .cv .hk,#s.iv .cv .tp{color:#fff}
#s.iv .cv .hk{top:262px}
#s.iv .cv .stk{bottom:300px!important}
#s.iv .cv .hk .mk:after{background:#FF3B3B}
#s.iv .cv .tp .tn{background:#FFD23F;color:#111}
.ivstamp{position:absolute;left:64px;top:140px;font:800 34px var(--head);color:#fff;background:#FF3B3B;border:5px solid #fff;padding:12px 26px;border-radius:16px;transform:rotate(-3deg);box-shadow:8px 8px 0 #FFD23F;letter-spacing:.02em}
.cv .tp .tn{font:800 40px var(--head);background:var(--ink);color:var(--yellow);padding:12px 26px;border-radius:18px;transform:rotate(-1.5deg)}
.ab .hd{position:absolute;left:64px;top:134px;font:800 84px/1 var(--head);letter-spacing:-2px}
.ab .dm{position:absolute;left:64px;right:64px;top:236px;height:506px;background:#fff;border:5px solid var(--ink);border-radius:32px;box-shadow:10px 10px 0 #111;overflow:hidden}
.ab .dmh{height:88px;display:flex;align-items:center;gap:18px;padding:0 26px;border-bottom:4px solid var(--ink);background:var(--acc,var(--yellow))}
.ab .av{width:62px;height:62px;border-radius:50%;background:#fff;border:4px solid var(--ink);font:800 22px/54px var(--head);text-align:center}
.ab .who2{font:800 34px var(--head);white-space:nowrap;max-width:640px;overflow:hidden}
.ab .avs{display:flex}
.ab .avs span{width:58px;height:58px;border-radius:50%;background:#fff;border:4px solid var(--ink);font-size:30px;line-height:50px;text-align:center;margin-left:-16px}
.ab .avs span:first-child{margin-left:0}
.ab .on em{font-style:italic;color:#333}
.ab .m{position:relative}
.ab .rx{position:absolute;left:-14px;bottom:-22px;background:#fff;color:#111;border:3px solid var(--ink);border-radius:999px;padding:2px 12px;font:800 20px var(--text)}
.ab .seen{align-self:flex-end;margin-top:-6px;font:700 20px var(--text);color:#777}
.ab .on{font:700 22px var(--text);display:flex;align-items:center;gap:8px}
.ab .on i{width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid var(--ink)}
.ab .msgs{padding:20px 26px;display:flex;flex-direction:column;gap:12px}
.ab .m{max-width:80%;padding:14px 22px;border-radius:26px;border:4px solid var(--ink);font:700 28px/1.3 var(--text)}
.ab .m.l{align-self:flex-start;background:#EDEDED;border-bottom-left-radius:6px}
.ab .m.r{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.ab .m.r span{color:var(--acc,var(--yellow))}
.ab .acts{position:absolute;left:64px;right:64px;top:768px;display:flex;gap:18px}
.ab .acts>div{flex:1;height:104px;border:4px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 #111;text-align:center;padding-top:14px}
.ab .acts .e{font-size:38px;line-height:1}
.ab .acts .t{font:800 25px var(--head);margin-top:6px}
.ab .fb{position:absolute;left:64px;right:64px;bottom:84px;height:92px;background:var(--ink);color:#fff;border-radius:28px;box-shadow:7px 7px 0 var(--acc,var(--yellow));display:flex;align-items:center;justify-content:center;gap:18px;font:800 46px var(--head)}
.ab .fb span{color:var(--acc,var(--yellow))}
.ab .st2{position:absolute;right:60px;top:150px;transform:rotate(8deg);background:var(--pink)}
</style></head>
<body><div id="s"></div>
<script>
const KW = /\b(SELECT|FROM|WHERE|AND|OR|NOT|IN|IS|NULL|AS|ON|JOIN|LEFT|RIGHT|FULL|OUTER|INNER|CROSS|GROUP|BY|ORDER|HAVING|LIMIT|OFFSET|DISTINCT|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|VIEW|INDEX|DROP|ALTER|ADD|COLUMN|PRIMARY|KEY|FOREIGN|REFERENCES|UNIQUE|DEFAULT|CHECK|CONSTRAINT|CASE|WHEN|THEN|ELSE|END|UNION|ALL|EXISTS|BETWEEN|LIKE|ASC|DESC|WITH|RECURSIVE|OVER|PARTITION|ROWS|RANGE|PRECEDING|FOLLOWING|CURRENT|ROW|UNBOUNDED|BEGIN|COMMIT|ROLLBACK|TRANSACTION|PROCEDURE|CALL|DELIMITER|COUNT|SUM|AVG|MIN|MAX|ROUND|COALESCE|NULLIF|CAST|ROW_NUMBER|RANK|DENSE_RANK|NTILE|LAG|LEAD|FIRST_VALUE|LAST_VALUE|UPPER|LOWER|LENGTH|CONCAT|TRIM|INT|VARCHAR|DECIMAL|DATE|TRUE|FALSE|ROLLUP|IF|TRUNCATE|RENAME|MODIFY|AUTO_INCREMENT|NOW|DATE_FORMAT|EXTRACT|YEAR|MONTH)\b/g;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hlSQL(code) {
  return String(code).split('\n').map(line => {
    let cm = '', i = line.indexOf('--');
    if (i >= 0) { cm = line.slice(i); line = line.slice(0, i); }
    const out = line.split(/('(?:[^']*)')/).map(p => p.startsWith("'") && p.endsWith("'") && p.length > 1 ? `<span class="s">${esc(p)}</span>`
      : esc(p).replace(KW, '<span class="k">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="nm">$1</span>')).join('');
    return out + (cm ? `<span class="c">${esc(cm)}</span>` : '');
  }).join('\n');
}
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[\[(.+?)\]\]/g, '<span class="mk">$1</span>');
const COLS = ['var(--yellow)', 'var(--pink)', 'var(--lime)', 'var(--blue)', 'var(--orange)', 'var(--violet)'];
const THEMES = [['#FFD23F', '#FFF4E0', '#D6ECFF'], ['#FF7EB6', '#FFF0F6', '#FFE9C7'], ['#B8F35A', '#F4FCE6', '#E8E0FF'], ['#7CC4FF', '#EEF7FF', '#FFF1D6'], ['#FF9F45', '#FFF3E8', '#DDF7EA'], ['#B79BFF', '#F4F0FF', '#FFE3F0']];
function fit(el, min) {
  if (!el) return; let fs = parseFloat(getComputedStyle(el).fontSize);
  while ((el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) && fs > min) { fs -= 1; el.style.fontSize = fs + 'px'; }
}
function fitBody(body) {
  let scale = 1;
  const els = [...body.querySelectorAll('.pt,.bub,.code,td,th,.col h3,.col p,.box,.chk,.nxt')];
  const base = els.map(e => parseFloat(getComputedStyle(e).fontSize));
  const bad = () => body.scrollHeight > body.clientHeight + 1 || [...body.querySelectorAll('.code')].some(c => c.scrollWidth > c.clientWidth + 1);
  while (bad() && scale > 0.55) { scale -= 0.03; els.forEach((e, i) => e.style.fontSize = (base[i] * scale) + 'px'); }
  return scale;
}
const HEADS = ['Post kaam aayi? 👀', 'Ruko zara! ✋', 'Samajh aaya? 🤔', 'Notes pasand aaye? 😍', 'Ek kaam karo 👇', 'Yahin ruko! 🛑', 'Bas 2 second 🙏', 'Aage kya? 👀'];
const CONVS = [
  [['l', 'Bhai SQL kaise seekhu? 😩'], ['r', 'Simple! <span>Follow</span> kar, aise notes milte rahenge 😎'], ['l', 'Done ✅ ye post bhi save kar li 📌'], ['r', 'Aur <span>dost ko bhi bhej</span> de 🔁']],
  [['l', 'Yaar {topic} samajh nahi aa raha tha 😭'], ['r', 'Ye post padh, <span>10 slide</span> mein clear 😌'], ['l', 'Bhai ekdum clear ho gaya 🔥'], ['r', '<span>Save</span> kar le, interview mein kaam aayega 📌']],
  [['l', 'Kal interview hai, SQL revise karna hai 😰'], ['r', 'Is page ki posts <span>save</span> kar, quick revision 📚'], ['l', 'Life saver ho bhai 🙏'], ['r', '<span>Follow</span> kar, next: {next} 👀']],
  [['l', 'Ye notes kahan se mile? 👀'], ['r', 'Is page se, <span>follow</span> kar le 😎'], ['l', 'Followed ✅ notes bhi save'], ['r', 'Ab <span>dost ko tag</span> kar 🔁']],
  [['l', 'Bhai {topic} pe kuch bhej 🙏'], ['r', 'Le, poore <span>10 slide</span> ke notes 📝'], ['l', 'Bas yahi chahiye tha 😍'], ['r', 'Comment mein <span>"SQL"</span> likh de 💬']],
  [['l', 'Mujhse SQL nahi hoga 😩'], ['r', 'Hoga bhai, <span>ek topic at a time</span>, chill 💪'], ['l', 'Theek hai, start karta hoon 🚀'], ['r', 'Pehle <span>follow</span> kar, phir shuru 🔔']],
  [['l', 'Bro tu itna SQL kaise jaanta hai? 🤯'], ['r', 'Yahan se seekha, <span>follow</span> kar 😉'], ['l', 'Notes save bhi kar liye 📌'], ['r', 'Ab <span>{next}</span> ka wait kar 👀']],
  [['l', 'Excel se bore ho gaya yaar 😮‍💨'], ['r', 'SQL seekh, <span>data pe raaj</span> kar 😎'], ['l', 'Kahan se shuru karu? 🤔'], ['r', 'Isi page se, <span>follow</span> kar 🔔']]];
const GN = [t => `${t} doubts 🤔`, t => `${t} gang 🔥`, t => `Raat 2 baje ${t} 🌙`, t => `${t} survivors 💀`, t => `${t} pe charcha ☕`, t => `${t} ke diwane 😍`, t => `Exam se pehle ${t} 😰`, t => `${t} wale log 😎`, t => `Backbenchers × ${t} 🎒`];
const gname = P => GN[(P.part * 7 + 2) % GN.length](P.topic.replace(/\s*\(.*?\)\s*/g, ' ').replace(/\s*&.*$/, '').trim());
function pickConv(P) {
  const k0 = (P.part - 1) % CONVS.length;
  for (let d = 0; d < CONVS.length; d++) {
    const c = CONVS[(k0 + d) % CONVS.length];
    const txt = c.map(m => m[1]).join(' ');
    if (txt.includes('{topic}') && P.topic.length > 22) continue;
    if (txt.includes('{next}') && (!P.next || P.next.length > 18)) continue;
    return c.map(([w, t]) => [w, t.replace('{topic}', esc(P.topic)).replace('{next}', esc(P.next || ''))]);
  }
  return CONVS[0];
}
window.renderSlide = (P, i) => {
  const s = document.getElementById('s'); const sl = P.slides[i]; const n = P.slides.length;
  s.className = (sl.type === 'cover' || sl.type === 'about') ? '' : 'grid';
  const IV = P.interview || P.module === 'Interview Prep';
  const T = IV ? ['#FF3B3B', '#FFF4EC', '#FFE3E3'] : THEMES[(P.part - 1) % THEMES.length];
  s.style.setProperty('--acc', T[0]);
  const BG = { cover: IV ? '#111111' : T[0], mistake: '#FFE3E3', recap: '#E6FBC4', about: T[2] };
  if (IV && sl.type === 'cover') s.className = 'iv';
  if (IV) s.classList.add('ivx');
  s.style.background = BG[sl.type] || T[1];
  const pn = String(P.part).padStart(2, '0');
  const top = `<div class="tag">SQL <b>${pn}</b>${P.part <= 81 ? '/81' : ''}${IV ? ' · 🎯 INTERVIEW' : ''}</div><div class="pgn">${i + 1}/${n}</div>`;
  const dots = `<div class="dots">${Array.from({ length: n }, (_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div><div class="hdl">@the30secdev</div>`;
  const sw = i < n - 1 ? `<div class="swipe">${i === 0 ? 'Swipe karo →' : 'Aage →'}</div>` : '';
  const bgn = `<div class="bgn">${String(i + 1).padStart(2, '0')}</div>`;
  const stk = sl.sticker ? `<div class="emo" style="right:72px;top:150px;transform:rotate(10deg)">${esc(sl.sticker)}</div>` : '';
  let html = '';
  if (sl.type === 'cover') {
    html = `<div class="cv">${bgn}${top}${IV ? '<div class="ivstamp">🎯 INTERVIEW QUESTION</div>' : `<div class="mod">${esc(P.module.toUpperCase())}</div>`}<div class="hk" id="hk">${md(sl.hook)}</div>
      <div class="tp">${IV ? 'Aaj ka sawaal' : 'Aaj ka topic'} <span class="tn">${esc(P.topic)}</span></div>
      <div class="stk" style="right:64px;bottom:230px;transform:rotate(6deg);background:${IV ? '#FFD23F' : '#fff'}">${IV ? 'Interview mein aata hai 🔥' : 'Save kar lo 📌'}</div>
      ${sl.sticker ? `<div class="emo" style="right:56px;top:250px;transform:rotate(12deg);font-size:110px">${esc(sl.sticker)}</div>` : ''}${dots}${sw}</div>`;
  } else if (sl.type === 'about') {
    html = `<div class="ab">${top}<div class="hd">${HEADS[(P.part * 5 + 3) % HEADS.length]}</div>
      <div class="dm"><div class="dmh"><div class="avs"><span>🧑‍💻</span><span>👩‍💻</span><span>🧑‍🎓</span></div><div><div class="who2" id="gname">${esc(gname(P))}</div><div class="on"><i></i>${2 + (P.part * 3) % 8} online · <em>typing…</em></div></div></div>
        <div class="msgs" id="msgs">${pickConv(P).map(([w, t], k) => `<div class="m ${w}"${k === 1 ? ' style="margin-bottom:14px"' : ''}>${t}${k === 1 ? `<span class="rx">❤️🔥 ${3 + (P.part * 11) % 47}</span>` : ''}</div>`).join('')}<div class="seen">Seen ✓✓</div></div></div>
      <div class="acts"><div style="background:#FF9EB8"><div class="e">❤️</div><div class="t">Like</div></div><div style="background:var(--lime)"><div class="e">💬</div><div class="t">Comment</div></div><div style="background:var(--yellow)"><div class="e">📌</div><div class="t">Save</div></div><div style="background:var(--blue)"><div class="e">🔁</div><div class="t">Share</div></div></div>
      <div class="fb">Follow karo <span>🔔</span></div>${dots}</div>`;
  } else {
    let body = '';
    const bub = sl.note ? `<div class="bub"><span class="who">${esc(sl.who || 'BHAI TIP 💡')}</span>${md(sl.note)}</div>` : '';
    if (sl.type === 'concept') {
      body = (sl.points || []).map((p, k) => `<div class="pt"><span class="n" style="background:${COLS[k % COLS.length]}">${k + 1}</span><span>${md(p)}</span></div>`).join('') + bub;
    } else if (sl.type === 'code') {
      body = `<div class="win"><div class="bar"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i><span>${esc(sl.file || 'query.sql')}</span></div><div class="code">${hlSQL(sl.code)}</div></div>` + bub;
    } else if (sl.type === 'table') {
      const hl = new Set(sl.highlight || []);
      body = `<table><tr>${sl.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${sl.rows.map((r, ri) => `<tr class="${hl.has(ri) ? 'hl' : ''}">${r.map(v => `<td>${md(v)}</td>`).join('')}</tr>`).join('')}</table>`
        + (sl.code ? `<div class="win"><div class="code">${hlSQL(sl.code)}</div></div>` : '') + bub;
    } else if (sl.type === 'compare') {
      const col = (c, bg) => `<div class="col" style="background:${bg}"><h3>${md(c.label)}</h3>${(c.points || []).map(p => `<p>${md(p)}</p>`).join('')}</div>`;
      body = `<div class="cmp">${col(sl.left, 'var(--blue)')}${col(sl.right, 'var(--pink)')}<div class="vs">VS</div></div>` + bub;
    } else if (sl.type === 'mistake') {
      const blk = (cls, lb, v, isCode) => `<div class="box ${cls}"><div class="lb">${lb}</div><div>${isCode ? `<div class="code">${hlSQL(v)}</div>` : md(v)}</div></div>`;
      body = blk('bad', '❌ GALAT', sl.wrong, sl.wrong_is_code) + blk('good', '✅ SAHI', sl.right, sl.right_is_code)
        + (sl.why ? `<div class="bub"><span class="who">KYUN? 🤔</span>${md(sl.why)}</div>` : '');
    } else if (sl.type === 'recap') {
      body = sl.points.map(p => `<div class="chk"><span class="bx">✓</span><span>${md(p)}</span></div>`).join('')
        + (P.next ? `<div class="nxt">Next: <span>${esc(P.next)}</span> →</div>` : `<div class="nxt"><span>Series complete!</span> 81/81 🎉</div>`);
    }
    const ttl = sl.type === 'mistake' ? `Galti mat <span class="mk" style="--x:1">karna</span> 🚫` : sl.type === 'recap' ? `Yaad <span class="mk">rakho</span> ✍️` : md(sl.title || '');
    html = `${bgn}${top}<div class="title" id="tt">${ttl}</div>${stk}<div class="body" id="bd">${body}</div>${dots}${sw}`;
  }
  s.innerHTML = html;
  if (sl.type === 'cover') { const hk = document.getElementById('hk'); fit(hk, 52); return { scale: parseFloat(getComputedStyle(hk).fontSize) / 116, overflow: hk.scrollHeight > hk.clientHeight + 1 }; }
  const tt = document.getElementById('tt');
  if (tt) { tt.style.height = '150px'; tt.style.overflow = 'hidden'; fit(tt, 38); }
  fit(document.getElementById('gname'), 20);
  const ms = document.getElementById('msgs');
  if (ms) { const dm = ms.parentElement; let fs = 28; while (dm.scrollHeight > dm.clientHeight + 1 && fs > 20) { fs -= 1; ms.querySelectorAll('.m').forEach(m => m.style.fontSize = fs + 'px'); } if (dm.scrollHeight > dm.clientHeight + 1) return { scale: 0.5, overflow: true }; }
  const bd = document.getElementById('bd');
  const sc = bd ? fitBody(bd) : 1;
  return { scale: sc, overflow: bd ? (bd.scrollHeight > bd.clientHeight + 1) : false };
};
</script></body></html>
