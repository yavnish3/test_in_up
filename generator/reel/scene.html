<body>
<div id="bg"><div id="dots"></div><div class="glow" id="g1"></div><div class="glow" id="g2"></div><div id="vig"></div></div>
<div id="stage"></div>
<div id="fx"><div id="flash"></div><div id="wipe2"></div><div id="wipe"></div></div>
<div id="prog"></div><div id="segs"></div>
<div id="cap"><div id="capbox"></div></div>
<div id="handle">@the30secdev</div>

<script src="gsap.min.js"></script>
<script>const TL = __TL__; const CAPS = __CAPS__; const R = __REEL__;</script>
<script src="reel_lib.js"></script>
<script>
/* Every beat has its own reel-native visual (R.beats[i].visual), animated on the spoken words.
   Elements name the word they belong to ("at"); unmatched ones are spread over the beat. */
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[\[(.+?)\]\]/g, '<span class="mk">$1</span>');
const KW = /\b(SELECT|FROM|WHERE|AND|OR|NOT|IN|IS|NULL|AS|ON|JOIN|LEFT|RIGHT|INNER|OUTER|FULL|GROUP|BY|ORDER|HAVING|LIMIT|DISTINCT|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|VIEW|INDEX|DROP|ALTER|ADD|PRIMARY|KEY|FOREIGN|REFERENCES|UNIQUE|DEFAULT|CASE|WHEN|THEN|ELSE|END|UNION|ALL|EXISTS|BETWEEN|LIKE|ASC|DESC|WITH|RECURSIVE|OVER|PARTITION|EXPLAIN|ANALYZE|ANALYSE|BEGIN|COMMIT|ROLLBACK|COUNT|SUM|AVG|MIN|MAX|COALESCE|ROW_NUMBER|RANK|DENSE_RANK|LAG|LEAD|TRUNCATE|PROCEDURE|TRIGGER|FUNCTION|RETURNS)\b/g;
function fitFont(lines) {
  const n = Math.max(0, ...lines.map(l => String(l.code || '').length));
  return n > 36 ? ` style="font-size:${Math.max(26, Math.floor(40 * 36 / n))}px"` : '';
}
function hl(line) {
  let cm = '', i = line.indexOf('--');
  if (i >= 0) { cm = line.slice(i); line = line.slice(0, i); }
  return line.split(/('(?:[^']*)')/).map(p => p.startsWith("'") && p.endsWith("'") && p.length > 1 ? `<span class="s">${esc(p)}</span>`
    : esc(p).replace(KW, '<span class="k">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="nm">$1</span>')).join('')
    + (cm ? `<span class="c">${esc(cm)}</span>` : '');
}
const norm = w => String(w).toLowerCase().normalize('NFKD').replace(/[^a-z0-9_]/g, '');
const P = R.post, stage = document.getElementById('stage');
const THEMES = {
  neon:   ['#C6FF3D', '#FF4FD8', '#3DF5FF', '#0B0716'],
  fire:   ['#FFC93D', '#FF5A36', '#FF9F45', '#140806'],
  ocean:  ['#3DF5FF', '#4F7BFF', '#9DFFDF', '#05101C'],
  matrix: ['#5CFF8A', '#00C26E', '#C6FF3D', '#03100A'],
  gold:   ['#FFD23F', '#FF7EB6', '#B79BFF', '#100C04'],
  candy:  ['#FF7EB6', '#B79BFF', '#7CC4FF', '#120818'],
  interview: ['#FFD23F', '#FF3B3B', '#FFFFFF', '#0A0A0A'],
};
const IV = !!(R.post.interview || R.post.module === 'Interview Prep');
{
  const names = Object.keys(THEMES), th = IV ? THEMES.interview : THEMES[R.theme] || THEMES[names[(P.part || 0) % names.length]];
  const root = document.documentElement.style;
  root.setProperty('--gold', th[0]); root.setProperty('--pink', th[1]); root.setProperty('--cyan', th[2]); root.setProperty('--bg', th[3]);
  document.body.style.background = th[3];
  if (IV) {
    document.getElementById('g1').style.background = 'radial-gradient(circle,rgba(255,59,59,.34),transparent 65%)';
    document.getElementById('g2').style.background = 'radial-gradient(circle,rgba(255,210,63,.20),transparent 65%)';
  }

      else if (e.kind === 'word') { gsap.set(e.sel, { opacity: 0, y: 60, rotate: 6 }); master.to(e.sel, { opacity: 1, y: 0, rotate: 0, duration: 0.3, ease: 'back.out(2.2)' }, at); }
      else if (e.kind === 'line') {
        master.set(e.sel, { opacity: 1 }, at);
        master.fromTo(`#${b.id}-cur`, { opacity: 1, top: 88 + e.k * 62 + 8, left: 34 }, { left: 34 + Math.min(880, e.n * 24), duration: Math.min(1.1, Math.max(0.35, e.n * 0.045)), ease: `steps(${Math.max(4, e.n)})`, immediateRender: false }, at);
        master.to(e.sel, { clipPath: 'inset(0 0% 0 0)', duration: Math.min(1.1, Math.max(0.35, e.n * 0.045)), ease: `steps(${Math.max(4, e.n)})` }, at);
        master.to(`#${b.id}-hl`, { opacity: 1, top: 88 + e.k * 62, duration: 0.25, ease: 'power2.out' }, at);
      }
      else if (e.kind === 'out') { master.to(`#${b.id}-run`, { scale: 1.25, backgroundColor: '#5CFFB0', duration: 0.15, yoyo: true, repeat: 1 }, at - 0.2); gsap.set(e.sel, { opacity: 0, y: 20 }); master.to(e.sel, { opacity: 1, y: 0, duration: 0.4 }, at); }
      else if (e.kind === 'circ') { gsap.set(e.sel, { opacity: 0, scale: 0.6, transformOrigin: '50% 50%' }); master.to(e.sel, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2)' }, at); }
      else if (e.kind === 'vhi') { master.to(e.sel, { opacity: 0.85, duration: 0.35 }, at); master.to(e.sel, { opacity: 0.55, duration: 0.5, yoyo: true, repeat: 3 }, at + 0.4); }
      else if (e.kind === 'bar') {
        const hgt = +document.querySelector(e.sel).dataset.h;
        master.to(e.sel, { height: hgt, duration: 0.6, ease: 'back.out(1.4)' }, at);
        master.to(`#${b.id}-bv${e.k}`, { opacity: 1, duration: 0.3 }, at + 0.35);
      }
      else if (e.kind === 'tev') {
        gsap.set(e.sel, { opacity: 0, x: 60 }); master.to(e.sel, { opacity: 1, x: 0, duration: 0.35, ease: 'expo.out' }, at);
        master.to(`#${b.id}-n${e.k}`, { borderColor: ACC, backgroundColor: ACC, color: '#0B0716', duration: 0.25 }, at + 0.1);
        master.to(`#${b.id}-tf`, { height: e.y + 10, duration: 0.35, ease: 'power2.out' }, at);
      }
      else if (e.kind === 'qline') {
        master.to(e.sel, { opacity: 1, borderLeftColor: '#3DF5FF', backgroundColor: 'rgba(61,245,255,.10)', duration: 0.2 }, at);
        if (e.k > 0) master.to(`#${b.id}-ql${e.k - 1}`, { opacity: 0.55, borderLeftColor: 'rgba(0,0,0,0)', backgroundColor: 'rgba(0,0,0,0)', duration: 0.2 }, at);
        gsap.set(`#${b.id}-qx${e.k}`, { opacity: 0, y: 20 });
        master.to(`#${b.id}-qx${e.k}`, { opacity: 1, y: 0, duration: 0.3, ease: 'back.out(2)' }, at + 0.12);
        if (e.k > 0) master.to(`#${b.id}-qx${e.k - 1}`, { opacity: 0, duration: 0.08 }, at);
      }
      else if (e.kind === 'qres') {
        master.to(`#${b.id}-ql${e.n - 1}`, { opacity: 0.55, borderLeftColor: 'rgba(0,0,0,0)', backgroundColor: 'rgba(0,0,0,0)', duration: 0.2 }, at);
        master.to(`[id^="${b.id}-ql"]`, { opacity: 1, duration: 0.3 }, at);
        master.to(`[id^="${b.id}-qx"]`, { opacity: 0, duration: 0.15 }, at);
        gsap.set(e.sel, { opacity: 0, scale: 0.9 }); master.to(e.sel, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' }, at + 0.1);
      }
      else if (e.kind === 'row') {
        gsap.set(e.sel, { opacity: 0, x: -80 }); master.to(e.sel, { opacity: 1, x: 0, duration: 0.35, ease: 'expo.out' }, at);
        master.to(`#${b.id}-sc`, { opacity: 1, top: 70 + e.k * 92, duration: 0.3, ease: 'power2.out' }, at);
      }
      else if (e.kind === 'step') {
        gsap.set(e.sel, { opacity: 0, scale: 0.7 }); master.to(e.sel, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, at);
        master.to(e.sel, { borderColor: ACC, boxShadow: `0 0 50px ${ACC}66`, duration: 0.2 }, at + 0.1);
        if (e.k > 0) master.to(`#${b.id}-f${e.k - 1}`, { borderColor: 'rgba(139,124,255,.6)', boxShadow: '0 0 0 rgba(0,0,0,0)', duration: 0.25 }, at + 0.1);
        if (e.k > 0) master.to(`#${b.id}-a${e.k - 1}`, { backgroundColor: ACC, duration: 0.25 }, at - 0.1);
      }
      else if (e.kind === 'arrow') { gsap.set(e.sel, { scaleY: 0, transformOrigin: '50% 0' }); master.to(e.sel, { scaleY: 1, duration: 0.3 }, at); }
      else if (e.kind === 'stat') {
        const v = info.v, to = Number(String(v.value).replace(/[^\d.]/g, '')) || 0, d = Math.max(1.2, last - at - 0.3);
        gsap.set(e.sel, { opacity: 0, scale: 0.8 }); master.to(e.sel, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, at);
        R2.counter(`#${b.id}-n`, 0, to, at, d, n => (v.prefix || '') + Math.round(n).toLocaleString('en-IN') + (v.suffix || ''));
        master.to(`#${b.id}-b`, { width: '100%', duration: d, ease: 'power2.out' }, at);
      }
      else if (e.kind === 'msg') {
        gsap.set(e.sel, { opacity: 0, y: 30, scale: 0.9 }); master.to(e.sel, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: 'back.out(2)' }, at);
      }
      else if (e.kind === 'check') {
        gsap.set(e.sel, { opacity: 0, x: 60 }); master.to(e.sel, { opacity: 1, x: 0, duration: 0.35, ease: 'expo.out' }, at - 0.15);
        master.to(`#${b.id}-x${e.k}`, { backgroundColor: ACC, duration: 0.15 }, at + 0.25);
        master.to(`#${b.id}-x${e.k} span`, { opacity: 1, scale: 1.3, duration: 0.2, yoyo: true, repeat: 1 }, at + 0.25);
      }
      else if (e.kind === 'vs') { gsap.set(e.sel, { opacity: 0, scale: 0, rotate: -90 }); master.to(e.sel, { opacity: 1, scale: 1, rotate: 0, duration: 0.5, ease: 'back.out(3)' }, at); }
      else if (e.kind === 'stamp') {
        gsap.set(e.sel, { opacity: 0, scale: 2.6, rotate: -14 });
        master.to(e.sel, { opacity: 1, scale: 1, rotate: -5, duration: 0.32, ease: 'power4.in' }, at + 0.15);
        master.to('#stage', { x: 14, duration: 0.05, yoyo: true, repeat: 5 }, at + 0.47);
      }
      else if (e.kind === 'dstep') {
        const L = info.live, p = L.plan[e.k], id = b.id, RH = L.RH, g = p.tag;
        const row = rid => `#${id}-${g}r${rid}`;
        const settle = t0 => p.order.forEach((rid, i) => master.to(row(rid), { top: i * RH, duration: 0.35, ease: 'power2.out' }, t0));
        if (p.sql) {
          if (e.k > 0) master.to(`#${id}-sq${e.k - 1}`, { opacity: 0, duration: 0.15 }, at - 0.15);
          gsap.set(`#${id}-sq${e.k}`, { opacity: 0, y: -14 }); master.to(`#${id}-sq${e.k}`, { opacity: 1, y: 0, duration: 0.25 }, at - 0.1);
        }
        const note = document.getElementById(`${id}-no${e.k}`);
        if (note) {
          document.querySelectorAll(`[id^="${id}-no"]`).forEach(n => { if (n !== note) master.to(n, { opacity: 0, duration: 0.15 }, at); });
          gsap.set(note, { opacity: 0, y: 20 }); master.to(note, { opacity: 1, y: 0, duration: 0.3, ease: 'back.out(2)' }, at + 0.35);
        }
        if (g === 'b' && document.getElementById(`${id}-lk`)) {
          master.fromTo(`#${id}-lk`, { scale: 1, color: '#FFFFFF' }, { scale: 1.25, color: '#C6FF3D', duration: 0.2, yoyo: true, repeat: 3, immediateRender: false }, at);
        }
        if (p.op === 'insert') {
          gsap.set(row(p.rid), { opacity: 0, x: 260, top: (p.order.length - 1) * RH });
          master.to(row(p.rid), { opacity: 1, x: 0, duration: 0.45, ease: 'back.out(1.6)' }, at + 0.15);
          master.fromTo(row(p.rid), { backgroundColor: 'rgba(92,255,176,.55)' }, { backgroundColor: 'rgba(21,14,39,1)', duration: 1.2, immediateRender: false }, at + 0.2);
        } else if (p.op === 'delete') {
          master.to(row(p.rid), { backgroundColor: 'rgba(255,92,122,.5)', duration: 0.2 }, at + 0.1);
          master.to(`${row(p.rid)} .lx`, { scaleX: 1, duration: 0.3 }, at + 0.25);
          master.to(row(p.rid), { opacity: 0, x: -260, duration: 0.35, ease: 'power2.in' }, at + 0.75);
          settle(at + 1.0);
        } else if (p.op === 'update') {
          const c = `#${id}-${g}c${p.rid}-${p.col}`;
          master.to(c, { backgroundColor: 'rgba(255,200,87,.45)', duration: 0.2, yoyo: true, repeat: 3 }, at + 0.1);
          master.to(`${c} .ov, ${c} .nv:not(#${id}-u${e.k})`, { opacity: 0, y: -40, duration: 0.3 }, at + 0.2);
          gsap.set(`#${id}-u${e.k}`, { opacity: 0, y: 40 }); master.to(`#${id}-u${e.k}`, { opacity: 1, y: 0, duration: 0.35, ease: 'back.out(2)' }, at + 0.35);
        } else if (p.op === 'filter') {
          p.drop.forEach(rid => { master.to(row(rid), { opacity: 0.18, duration: 0.3 }, at + 0.1); master.to(`${row(rid)} .lx`, { scaleX: 1, duration: 0.3 }, at + 0.2); master.to(row(rid), { opacity: 0, duration: 0.3 }, at + 1.0); });
          p.order.forEach(rid => master.to(row(rid), { boxShadow: 'inset 0 0 0 4px rgba(92,255,176,.8)', duration: 0.25 }, at + 0.2));
          settle(at + 1.2);
        } else if (p.op === 'sort') {
          settle(at + 0.15);
        } else if (p.op === 'highlight') {
          p.rows.forEach(rid => master.to(row(rid), { backgroundColor: 'rgba(255,200,87,.35)', scale: 1.03, duration: 0.25, yoyo: true, repeat: 1 }, at + 0.1));
        } else if (p.op === 'add_col') {
          master.to(`#${id}-${g}nh`, { width: 200, opacity: 1, duration: 0.35 }, at);
          p.ids.forEach((rid, i) => { const el = document.querySelector(`#${id}-${g}n${rid}`); if (el) el.textContent = p.vals[i];
            master.to(`#${id}-${g}n${rid}`, { width: 200, opacity: 1, duration: 0.25 }, at + 0.25 + i * 0.22);
            master.fromTo(`#${id}-${g}n${rid}`, { color: '#FFFFFF' }, { color: '#C6FF3D', duration: 0.3, immediateRender: false }, at + 0.3 + i * 0.22); });
        }
      }
      else if (e.kind === 'tfilter') {
        const t1 = Math.min(at + 0.5, end - 0.8);
        master.to(`#${b.id}-tb .td:not(.hi)`, { opacity: 0.22, duration: 0.35 }, t1);
        master.to(`#${b.id}-tb .td.hi`, { scale: 1.05, duration: 0.22, yoyo: true, repeat: 1, ease: 'power2.out' }, t1 + 0.1);
      }
      else if (e.kind === 'qwrong') {
        master.to(`#${b.id}-tm`, { opacity: 0, duration: 0.2 }, at - 0.1);
        gsap.set(e.sel, { opacity: 0, x: -80 }); master.to(e.sel, { opacity: 1, x: 0, duration: 0.35, ease: 'expo.out' }, at);
        master.to(`#${b.id}-qm`, { scale: 1.25, duration: 0.25, yoyo: true, repeat: 3, ease: 'sine.inOut' }, at);
      }
      else if (e.kind === 'qright') {
        master.to(`#${b.id}-qx`, { scaleX: 1, duration: 0.25, ease: 'power2.out' }, at - 0.15);
        master.to(`#${b.id}-qw`, { opacity: 0.45, x: -12, duration: 0.08, yoyo: true, repeat: 3 }, at - 0.15);
        master.to(`#${b.id}-qm`, { opacity: 0, duration: 0.2 }, at);
        gsap.set(e.sel, { opacity: 0, scale: 0.7 }); master.to(e.sel, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2.4)' }, at);
        master.to(e.sel, { boxShadow: '0 0 70px rgba(92,255,176,.55)', duration: 0.3 }, at + 0.2);
      }
      else if (e.kind === 'cta') {
        gsap.set(e.sel, { opacity: 0, y: 40 }); master.to(e.sel, { opacity: 1, y: 0, duration: 0.4, ease: 'back.out(2)' }, at);
        master.to(`${e.sel} span`, { scale: 1.08, duration: 0.35, yoyo: true, repeat: 5, ease: 'sine.inOut' }, at + 0.4);
      }
      else { gsap.set(e.sel, { opacity: 0, y: 40, scale: 0.95 }); R2.popIn(e.sel, at); }
    });
    from = 0;
    (b.cues || []).forEach((c, ci) => {
      if (IV && bi === 0 && c.do === 'kinetic') return;  // the INTERVIEW stamp owns the hook
      let at = find(c.word); if (at == null) return;
      at = Math.min(at + 0.05, end - 0.6);
      const target = els.filter(e => !['box', 'arrow', 'vs'].includes(e.kind))[(parseInt(c.target) || 0) - 1];
      if (c.do === 'kinetic') {
        const kid = `${b.id}-q${ci}`;
        add(`<div class="kin ${['', 'p', 'c'][ci % 3]}" id="${kid}">${esc(String(c.target || c.word).slice(0, 16))}</div>`);
        master.fromTo(`#${kid}`, { opacity: 0, scale: 0.4, rotate: -14 }, { opacity: 1, scale: 1, rotate: -4, duration: 0.35, ease: 'back.out(2.5)', immediateRender: false }, at);
        master.to(`#${kid}`, { opacity: 0, scale: 1.25, duration: 0.25, ease: 'power2.in' }, at + 1.0);
      } else if (c.do === 'emoji') {
        const kid = `${b.id}-q${ci}`;
        add(`<div class="burst" id="${kid}" style="left:${800 - (ci % 2) * 120}px;top:${960 + (ci % 2) * 40}px">${esc(String(c.target || '🔥').slice(0, 4))}</div>`);
        master.fromTo(`#${kid}`, { opacity: 0, scale: 0.2, y: 40 }, { opacity: 1, scale: 1.2, y: 0, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, at);
        master.to(`#${kid}`, { opacity: 0, y: -160, rotate: 25, duration: 0.8, ease: 'power1.in' }, at + 0.5);
      } else if (c.do === 'flash') {
        master.fromTo('#flash', { opacity: 0.25 }, { opacity: 0, duration: 0.18, immediateRender: false }, at);
      } else if (target && c.do === 'shake') {
        master.to(target.sel, { keyframes: [{ x: -16 }, { x: 14 }, { x: -10 }, { x: 8 }, { x: 0 }], duration: 0.45 }, at);
      } else if (target && (c.do === 'zoom' || c.do === 'highlight' || c.do === 'pop')) {
        master.to(target.sel, { scale: 1.1, duration: 0.22, ease: 'power3.out' }, at);
        master.to(target.sel, { scale: 1, duration: 0.35, ease: 'power2.inOut' }, at + 0.7);
      }
    });
    if (bi === R.beats.length - 1 && TL.outro) {  // outro: cheat sheet, then cut back to the hook frame (loop)
      const rv = b.visual || {};
      const items = (rv.items || []).map(x => x.text || x).slice(0, 4);
      const pts = items.length ? items : String(b.cap || '').split(/[.,;]/).map(x => x.trim()).filter(Boolean).slice(0, 3);
      add(`<div id="cheat"><div class="ct">📸 SCREENSHOT LE LO</div><div class="cn">${esc(P.topic)}</div>` +
          pts.map(p => `<div class="ci">✅ ${md(p)}</div>`).join('') + `<div class="ch">@the30secdev</div></div>`);
      const hot = (String(P.hook).match(/\[\[(.+?)\]\]/) || [])[1] || '';
      const hw = String(P.hook).replace(/\[\[|\]\]/g, '').split(/\s+/);
      add(`<div id="loopk"><div class="hdr" style="opacity:1"><div class="step"><span class="tag">POV</span>${IV ? `🚨 INTERVIEW QUESTION · PART ${P.part}` : `SQL SERIES · PART ${P.part}`}</div></div>` +
          `<div class="hk">${hw.map(w => `<span class="w"${hot.includes(w) ? ' style="color:var(--gold)"' : ''}>${esc(w)} </span>`).join('')}</div>` +
          `<div class="emo" style="right:70px;top:820px">${esc(P.cover_sticker || '🔥')}</div></div>`);
      const o = R2.P(TL.outro);
      master.fromTo('#cheat', { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'power2.out', immediateRender: false }, o);
      master.fromTo('#cheat .ci', { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.25, stagger: 0.12, immediateRender: false }, o + 0.2);
      master.fromTo('#loopk', { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, R2.P(TL.duration) - 0.4);
      master.fromTo('#flash', { opacity: 0.3 }, { opacity: 0, duration: 0.2, immediateRender: false }, R2.P(TL.duration) - 0.4);
    }
    if (bi < R.beats.length - 1) { R2.hdrOut(b.id); master.to(info.root, { opacity: 0, y: -40, duration: 0.3, ease: 'power2.in' }, end - 0.3); }
    if (bi > 0) {
      gsap.set(info.root, { opacity: 1 });
      master.fromTo('#wipe2', { xPercent: -120 }, { xPercent: 120, duration: 0.42, ease: 'power3.inOut', immediateRender: false }, start - 0.3);
      master.fromTo('#wipe', { xPercent: -120 }, { xPercent: 120, duration: 0.42, ease: 'power3.inOut', immediateRender: false }, start - 0.24);
    }
  });
  R2.everyFrame(t => {
    R.beats.forEach((b, bi) => { const el = document.getElementById(`v-${b.id}`); if (el) el.style.translate = `0 ${Math.sin(t * 1.6 + bi) * 8}px`; });
    const e = document.getElementById(`${R.beats[0].id}-e`); if (e) e.style.rotate = `${Math.sin(t * 3) * 8}deg`;
    document.querySelectorAll('.vs').forEach(d => d.style.rotate = `${Math.sin(t * 2) * 6}deg`);
    document.getElementById('prog').style.width = `${Math.min(100, 100 * t / TL.duration)}%`;
    const segs = document.getElementById('segs');  // Instagram-story style: one bar per scene
    if (!segs.children.length) segs.innerHTML = TL.beats.map(() => '<i><b></b></i>').join('') + (TL.outro ? '<i><b></b></i>' : '');
    const parts = TL.beats.map(x => [x.start, x.end]).concat(TL.outro ? [[TL.outro, TL.duration]] : []);
    [...segs.children].forEach((el, k) => { const [a, z] = parts[k]; el.firstChild.style.width = `${Math.max(0, Math.min(100, 100 * (t - a) / Math.max(0.01, z - a)))}%`; });
  });
});
</script>
</body></html>
