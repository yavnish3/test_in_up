<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Inter:wght@500;600;800&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="reel_base.css">
<style>
:root{--bg:#0B0716;--blue:#8B7CFF;--gold:#C6FF3D;--pink:#FF4FD8;--cyan:#3DF5FF;--red:#FF5C7A;--green:#5CFFB0;--card:#150E27;

.step{color:var(--gold);font-size:30px}

.mk,.kw b{color:var(--gold)}
.vz{position:absolute;inset:0}                         /* one visual per beat */
b{color:var(--gold);font-weight:800}
.hk{position:absolute;left:80px;top:300px;width:900px;font:800 124px/1 var(--head);letter-spacing:-.03em}
.hk .w{display:inline-block;margin-right:22px}
.emo{position:absolute;font-size:170px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.5))}
.topic{position:absolute;left:80px;top:1060px;font:800 54px var(--head);color:#0B0716;background:var(--gold);padding:16px 34px;border-radius:24px;transform:rotate(-2deg);white-space:nowrap;box-shadow:8px 8px 0 var(--pink)}
.topic small{display:block;font:600 26px var(--mono);letter-spacing:.08em;color:#2a1f40}
.kl{position:absolute;left:80px;width:920px;font:800 112px/1.02 var(--head);letter-spacing:-.03em;white-space:nowrap}
.kl.s2{color:var(--cyan)} .kl.s3{color:var(--pink)}
.cpanel{position:absolute;left:60px;top:560px;width:960px;border-radius:30px;background:#120C22;border:3px solid rgba(198,255,61,.45);padding:88px 34px 34px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.cpanel .bar{position:absolute;left:30px;top:30px;display:flex;gap:12px;align-items:center;font:500 26px var(--mono);color:var(--muted)}
.cpanel .bar i{width:18px;height:18px;border-radius:50%;display:inline-block}
.cpanel .run{position:absolute;right:28px;top:20px;font:800 26px var(--mono);color:#0B0716;background:var(--gold);padding:8px 18px;border-radius:12px}
.cl{position:relative;display:block;font:500 40px/62px var(--mono);white-space:pre;color:var(--ink);clip-path:inset(0 100% 0 0)}
.cl .k{color:var(--pink)} .cl .s{color:var(--gold)} .cl .c{color:var(--muted)} .cl .nm{color:var(--cyan)}
.lhl{position:absolute;left:14px;right:14px;height:62px;border-radius:12px;background:rgba(198,255,61,.10);border-left:6px solid var(--gold);opacity:0}
.out{margin-top:20px;border-top:2px dashed rgba(198,255,61,.35);padding-top:18px;font:500 34px/48px var(--mono);color:var(--green);white-space:pre-wrap;opacity:0}
.qpanel{position:absolute;left:50px;top:560px;width:980px;border-radius:30px;background:#120C22;border:3px solid rgba(61,245,255,.5);padding:84px 30px 30px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.qpanel .bar{position:absolute;left:30px;top:30px;display:flex;gap:12px;align-items:center;font:500 26px var(--mono);color:var(--muted)}
.qpanel .bar i{width:18px;height:18px;border-radius:50%;display:inline-block}
.ql{position:relative;display:block;font:500 40px/64px var(--mono);white-space:pre;color:var(--ink);opacity:.28;padding-left:16px;border-left:6px solid transparent}
.ql .k{color:var(--pink)} .ql .s{color:var(--gold)} .ql .c{color:var(--muted)} .ql .nm{color:var(--cyan)}
.qx{position:absolute;left:50px;width:980px;font:700 44px/1.25 var(--text);color:#0B0716;background:var(--cyan);padding:20px 30px;border-radius:24px;box-shadow:8px 8px 0 var(--pink);opacity:0}
.qx .arr{font:800 30px var(--mono);margin-right:12px}
.qres{position:absolute;left:50px;width:980px;font:500 36px/1.4 var(--mono);color:var(--green);background:rgba(92,255,176,.08);border:3px dashed rgba(92,255,176,.5);border-radius:24px;padding:18px 28px;opacity:0;white-space:pre-wrap}
.venn{position:absolute;left:90px;top:570px;width:900px;height:640px}

.venn .cap2{position:absolute;left:0;right:0;top:560px;text-align:center;font:800 50px var(--head);color:var(--gold)}
.bars{position:absolute;left:90px;top:600px;width:900px;height:620px;display:flex;align-items:flex-end;gap:36px;border-bottom:4px solid rgba(255,255,255,.25)}

.bars .bb{width:100%;border-radius:18px 18px 6px 6px;background:linear-gradient(180deg,var(--gold),var(--pink));height:0}
.bars .bl{position:absolute;bottom:-64px;font:700 34px var(--text);color:var(--ink)}
.bars .b{position:relative}
.tline{position:absolute;left:150px;top:600px;width:6px;height:640px;background:rgba(255,255,255,.15);border-radius:3px}
.tfill{position:absolute;left:0;top:0;width:6px;height:0;background:linear-gradient(180deg,var(--gold),var(--pink));border-radius:3px}
.tev{position:absolute;left:110px;height:100px;display:flex;align-items:center;gap:34px;font:800 52px var(--head);white-space:nowrap}
.tev .nd{width:86px;height:86px;border-radius:50%;background:var(--card);border:5px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font:800 36px var(--head);color:var(--ink)}
.tev small{display:block;font:600 34px var(--text);color:var(--muted)}
.tb{position:absolute;left:60px;top:580px;width:960px;border-radius:26px;background:rgba(18,12,34,.92);border:3px solid rgba(139,124,255,.5);overflow:hidden}
.tb .tr{display:flex;align-items:center;height:92px;position:relative}
.tb .tr>div{padding-left:26px;font:600 40px var(--text);white-space:nowrap;overflow:hidden}
.tb .th>div{font:500 28px var(--mono);color:var(--gold);letter-spacing:.06em}
.tb .th{height:70px;border-bottom:2px solid rgba(139,124,255,.3)}
.tb .td.hi>div{color:var(--gold)}
.scan{position:absolute;left:0;right:0;height:92px;background:linear-gradient(90deg,rgba(61,245,255,0),rgba(61,245,255,.28),rgba(61,245,255,0));border-top:3px solid var(--cyan);border-bottom:3px solid var(--cyan);opacity:0}
.fs{position:absolute;left:140px;width:800px;height:150px;border-radius:32px;background:var(--card);border:3px solid rgba(139,124,255,.6);display:flex;align-items:center;justify-content:center;gap:18px;font:800 60px var(--head)}
.fs.on{border-color:var(--gold);box-shadow:0 0 50px rgba(198,255,61,.35)}
.fa{position:absolute;left:532px;width:16px;height:64px;border-radius:8px;background:rgba(139,124,255,.35)}
.st{position:absolute;left:0;right:0;top:600px;text-align:center}
.st .num{font:800 230px/1 var(--head);color:var(--gold);letter-spacing:-.04em;text-shadow:0 0 60px rgba(198,255,61,.35)}
.st .lab{font:700 56px var(--head);color:var(--ink);margin-top:20px}
.st .barw{width:760px;height:30px;border-radius:15px;margin:44px auto 0;background:rgba(255,255,255,.08);overflow:hidden}
.st .bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--pink))}
.cp{position:absolute;top:580px;width:460px;min-height:420px;border-radius:30px;padding:30px;border:3px solid}
.cp .lb{font:800 54px/1.05 var(--head);margin-bottom:24px}
.cp .li{font:600 38px/1.3 var(--text);margin-bottom:20px}
.cp.a{left:50px;background:rgba(61,245,255,.08);border-color:var(--cyan)} .cp.a .lb{color:var(--cyan)}
.cp.b{left:570px;background:rgba(255,79,216,.10);border-color:var(--pink)} .cp.b .lb{color:var(--pink)}
.vs{position:absolute;left:470px;top:820px;width:140px;height:140px;border-radius:50%;background:var(--gold);color:#0B0716;font:800 54px var(--head);display:flex;align-items:center;justify-content:center;box-shadow:6px 6px 0 #000;z-index:2}
.qz{position:absolute;left:60px;top:540px;width:960px;border-radius:30px;background:var(--card);border:3px solid var(--cyan);padding:38px 40px 30px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.qz .q{font:800 60px/1.12 var(--head);color:#fff}
.qz .qm{font:800 120px/1 var(--head);color:var(--gold);margin-top:10px}
.qa{position:absolute;left:90px;width:900px;border-radius:26px;padding:22px 34px;font:800 58px/1.1 var(--head);border:3px solid;text-align:left}
.qa .tg{display:block;font:700 28px var(--mono);opacity:.85;margin-bottom:8px;letter-spacing:.04em}
.qa.w{top:960px;color:var(--red);border-color:var(--red);background:rgba(255,92,122,.08)}
.qa.r{top:1160px;color:var(--green);border-color:var(--green);background:rgba(92,255,176,.10)}
.qa .x{position:absolute;left:24px;right:24px;top:50%;height:8px;background:var(--red);transform:scaleX(0);transform-origin:0 50%;border-radius:4px}
.cf{position:absolute;left:60px;top:560px;width:960px;border-radius:34px;padding:44px 40px;background:linear-gradient(160deg,rgba(255,79,216,.16),rgba(61,245,255,.08));border:4px solid var(--pink);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.cf .tg{font:800 32px var(--mono);color:var(--pink);letter-spacing:.06em}
.cf .q{font:800 64px/1.15 var(--head);color:#fff;margin-top:20px}
.cta{position:absolute;left:0;right:0;top:1150px;text-align:center}
.cta span{display:inline-block;max-width:900px;white-space:nowrap;font:800 40px var(--head);color:#0B0716;background:var(--gold);padding:18px 34px;border-radius:24px;transform:rotate(-2deg);box-shadow:8px 8px 0 var(--pink)}
.chat{position:absolute;left:70px;top:560px;width:940px;border-radius:34px;background:#120C22;border:3px solid rgba(139,124,255,.5);padding:26px 26px 30px}
.chat .hd{display:flex;align-items:center;gap:16px;font:800 34px var(--head);padding-bottom:18px;border-bottom:2px solid rgba(139,124,255,.25);margin-bottom:18px}
.chat .hd i{font-style:normal;font:500 24px var(--mono);color:var(--green)}
.msg{display:block;width:fit-content;max-width:740px;font:600 38px/1.3 var(--text);padding:18px 26px;border-radius:30px;margin:14px 0}
.msg.l{background:rgba(255,255,255,.09);border-bottom-left-radius:8px}
.msg.r{background:var(--pink);color:#fff;margin-left:auto;border-bottom-right-radius:8px}
.typing{display:inline-flex;gap:8px;padding:16px 22px;border-radius:24px;background:rgba(255,255,255,.09);opacity:0;position:absolute}
.typing i{width:14px;height:14px;border-radius:50%;background:var(--muted)}
.ck{position:absolute;left:80px;width:920px;height:118px;border-radius:26px;background:rgba(198,255,61,.07);border:3px solid rgba(198,255,61,.45);display:flex;align-items:center;gap:26px;padding:0 30px;font:700 42px var(--text);white-space:nowrap}
.ck .box{flex:none;width:62px;height:62px;border-radius:16px;border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;font:800 40px var(--head);color:#0B0716}
.ck .box span{opacity:0}
.kin{position:absolute;left:50%;top:1170px;transform:translate(-50%,0) rotate(-4deg);font:800 96px/1 var(--head);color:#0B0716;
  background:var(--gold);padding:18px 40px;border-radius:28px;box-shadow:10px 10px 0 var(--pink),0 0 60px rgba(198,255,61,.45);white-space:nowrap;opacity:0;z-index:20}
.kin.p{background:var(--pink);color:#fff;box-shadow:10px 10px 0 var(--cyan),0 0 60px rgba(255,79,216,.5)}
.kin.c{background:var(--cyan);box-shadow:10px 10px 0 var(--gold),0 0 60px rgba(61,245,255,.45)}
.burst{position:absolute;font-size:120px;opacity:0;z-index:21;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:25;pointer-events:none}
#wipe{position:absolute;left:0;top:0;width:1080px;height:1920px;background:var(--pink);z-index:30}
#wipe2{position:absolute;left:0;top:0;width:1080px;height:1920px;background:var(--gold);z-index:29}
#prog{position:absolute;left:0;top:0;height:12px;width:0;background:linear-gradient(90deg,var(--gold),var(--pink),var(--cyan));z-index:40}
#capbox{background:rgba(11,7,22,.82);border:3px solid rgba(198,255,61,.35)}
#handle{position:absolute;left:0;right:0;top:1820px;text-align:center;font:600 30px var(--mono);color:rgba(232,238,248,.55)}
</style></head>
<body>
<div id="bg"><div id="dots"></div><div class="glow" id="g1"></div><div class="glow" id="g2"></div><div id="vig"></div></div>
<div id="stage"></div>
<div id="fx"><div id="flash"></div><div id="wipe2"></div><div id="wipe"></div></div>
<div id="prog"></div>
<div id="cap"><div id="capbox"></div></div>
<div id="handle">@the30secdev</div>

<script src="gsap.min.js"></script>
<script>const TL = __TL__; const CAPS = __CAPS__; const R = __REEL__;</script>
<script src="reel_lib.js"></script>
<script>
/* Every beat has its own reel-native visual (R.beats[i].visual), animated on the spoken words.
   Elements name the word they belong to ("at"); unmatched ones are spread over the beat. */
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[\[(.+?)\]\]/g, '<span class="mk">$1</span>');
const KW = /\b(SELECT|FROM|WHERE|AND|OR|NOT|IN|IS|NULL|AS|ON|JOIN|LEFT|RIGHT|INNER|OUTER|FULL|GROUP|BY|ORDER|HAVING|LIMIT|DISTINCT|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|VIEW|INDEX|DROP|ALTER|ADD|PRIMARY|KEY|FOREIGN|REFERENCES|UNIQUE|DEFAULT|CASE|WHEN|THEN|ELSE|END|UNION|ALL|EXISTS|BETWEEN|LIKE|ASC|DESC|WITH|RECURSIVE|OVER|PARTITION|EXPLAIN|ANALYZE|ANALYSE|BEGIN|COMMIT|ROLLBACK|COUNT|SUM|AVG|MIN|MAX|COALESCE|ROW_NUMBER|RANK|DENSE_RANK|LAG|LEAD|TRUNCATE|PROCEDURE|TRIGGER|FUNCTION|RETURNS)\b/g;
function fitFont(lines) {
  const n = Math.max(0, ...lines.map(l => String(l.code || '').length));
  return n > 36 ? ` style="font-size:${Math.max(26, Math.floor(40 * 36 / n))}px"` : '';
}
function hl(line) {
  let cm = '', i = line.indexOf('--');
  if (i >= 0) { cm = line.slice(i); line = line.slice(0, i); }
  return line.split(/('(?:[^']*)')/).map(p => p.startsWith("'") && p.endsWith("'") && p.length > 1 ? `<span class="s">${esc(p)}</span>`
    : esc(p).replace(KW, '<span class="k">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="nm">$1</span>')).join('')
    + (cm ? `<span class="c">${esc(cm)}</span>` : '');
}
const norm = w => String(w).toLowerCase().normalize('NFKD').replace(/[^a-z0-9_]/g, '');
const P = R.post, stage = document.getElementById('stage');
const THEMES = {
  neon:   ['#C6FF3D', '#FF4FD8', '#3DF5FF', '#0B0716'],
  fire:   ['#FFC93D', '#FF5A36', '#FF9F45', '#140806'],
  ocean:  ['#3DF5FF', '#4F7BFF', '#9DFFDF', '#05101C'],
  matrix: ['#5CFF8A', '#00C26E', '#C6FF3D', '#03100A'],
  gold:   ['#FFD23F', '#FF7EB6', '#B79BFF', '#100C04'],
  candy:  ['#FF7EB6', '#B79BFF', '#7CC4FF', '#120818'],
};
{
  const names = Object.keys(THEMES), th = THEMES[R.theme] || THEMES[names[(P.part || 0) % names.length]];
  const root = document.documentElement.style;
  root.setProperty('--gold', th[0]); root.setProperty('--pink', th[1]); root.setProperty('--cyan', th[2]); root.setProperty('--bg', th[3]);
  document.body.style.background = th[3];
}
const ACC = getComputedStyle(document.documentElement).getPropertyValue('--gold').trim();  // theme accent
const add = (html) => stage.insertAdjacentHTML('beforeend', html);
const V = {};   // beat id -> { root, els: [{sel, at, kind}], fx: [] }

R.beats.forEach((b, bi) => {
  const id = b.id, v = b.visual || {}, t = v.type || 'kinetic';
  const els = []; V[id] = { root: `#v-${id}`, els, type: t, v };
  const tag = bi === 0 ? 'POV' : id === 'galti' ? 'RED FLAG 🚩' : id === 'recap' ? 'TL;DR' : String(bi);
  const step = bi === 0 ? `SQL SERIES · PART ${P.part}` : id === 'galti' ? 'GALTI MAT KARNA' : id === 'recap' ? 'YAAD RAKHO' : esc(P.topic).toUpperCase();
  add(`<div class="hdr" id="h-${id}"><div class="step"><span class="tag">${tag}</span>${step}</div>` +
      (b.title && bi > 0 ? `<div class="kw t"><span class="ln"><span>${md(b.title)}</span></span></div>` : '') + `</div>`);
  let h = `<div class="vz" id="v-${id}">`;
  if (bi === 0) {
    const words = String(P.hook).replace(/\[\[|\]\]/g, '').split(/\s+/);
    const hot = (String(P.hook).match(/\[\[(.+?)\]\]/) || [])[1] || '';
    h += `<div class="hk">${words.map((w, k) => `<span class="w" id="${id}-w${k}"${hot.includes(w) ? ' style="color:var(--gold)"' : ''}>${esc(w)}</span>`).join('')}</div>`;
    words.forEach((w, k) => els.push({ sel: `#${id}-w${k}`, at: w, kind: 'word' }));
    h += `<div class="emo" id="${id}-e" style="right:70px;top:820px">${esc(P.cover_sticker || '🔥')}</div>`;
    h += `<div class="topic" id="${id}-t"><small>AAJ KA TOPIC</small>${esc(P.topic)}</div>`;
    els.push({ sel: `#${id}-t` }, { sel: `#${id}-e` });
  } else if (t === 'kinetic') {
    (v.lines || []).slice(0, 4).forEach((l, k) => { h += `<div class="kl s${k % 3 + 1}" id="${id}-k${k}" style="top:${600 + k * 140}px">${md(l.text)}</div>`; els.push({ sel: `#${id}-k${k}`, at: l.at }); });
  } else if (t === 'code') {
    const lines = (v.lines || []).slice(0, 8), fs = fitFont(lines);
    h += `<div class="cpanel" id="${id}-c"><div class="bar"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i>&nbsp;${esc(v.file || 'query.sql')}</div>` +
      `<div class="run" id="${id}-run">▶ RUN</div><div class="lhl" id="${id}-hl"></div>` +
      lines.map((l, k) => `<span class="cl" id="${id}-l${k}"${fs}>${hl(l.code) || ' '}</span>`).join('') +
      (v.output ? `<div class="out" id="${id}-o">${esc(v.output)}</div>` : '') + `</div>`;
    els.push({ sel: `#${id}-c`, kind: 'box' });
    lines.forEach((l, k) => els.push({ sel: `#${id}-l${k}`, at: l.at, kind: 'line', n: String(l.code).length, k }));
    if (v.output) els.push({ sel: `#${id}-o`, at: v.output_at, kind: 'out' });
  } else if (t === 'venn') {
    const part = v.highlight || 'left_only', L = 330, Rr = 570, Y = 280, r = 230;
    const fillFor = which => ({ left_only: ['url(#hatch)', 'none'], both: ['none', 'none'] })[which];
    h += `<div class="venn" id="${id}-vn"><svg viewBox="0 0 900 600">
      <defs><clipPath id="${id}-cl"><circle cx="${L}" cy="${Y}" r="${r}"/></clipPath>
        <clipPath id="${id}-cr"><circle cx="${Rr}" cy="${Y}" r="${r}"/></clipPath>
        <mask id="${id}-mlo"><rect width="900" height="600" fill="black"/><circle cx="${L}" cy="${Y}" r="${r}" fill="white"/><circle cx="${Rr}" cy="${Y}" r="${r}" fill="black"/></mask>
        <mask id="${id}-mro"><rect width="900" height="600" fill="black"/><circle cx="${Rr}" cy="${Y}" r="${r}" fill="white"/><circle cx="${L}" cy="${Y}" r="${r}" fill="black"/></mask></defs>
      <g id="${id}-hi" opacity="0">
        ${part === 'left_only' ? `<rect width="900" height="600" fill="var(--gold)" mask="url(#${id}-mlo)"/>` : ''}
        ${part === 'right_only' ? `<rect width="900" height="600" fill="var(--gold)" mask="url(#${id}-mro)"/>` : ''}
        ${part === 'both' ? `<circle cx="${Rr}" cy="${Y}" r="${r}" fill="var(--gold)" clip-path="url(#${id}-cl)"/>` : ''}
        ${part === 'left' ? `<circle cx="${L}" cy="${Y}" r="${r}" fill="var(--gold)"/>` : ''}
        ${part === 'all' ? `<circle cx="${L}" cy="${Y}" r="${r}" fill="var(--gold)"/><circle cx="${Rr}" cy="${Y}" r="${r}" fill="var(--gold)"/>` : ''}
      </g>
      <circle id="${id}-c1" cx="${L}" cy="${Y}" r="${r}" fill="rgba(61,245,255,.10)" stroke="var(--cyan)" stroke-width="6"/>
      <circle id="${id}-c2" cx="${Rr}" cy="${Y}" r="${r}" fill="rgba(255,79,216,.10)" stroke="var(--pink)" stroke-width="6"/>
      <text class="lab" x="${L - 120}" y="${Y + 14}" text-anchor="middle">${esc(v.left || 'A')}</text>
      <text class="lab" x="${Rr + 120}" y="${Y + 14}" text-anchor="middle">${esc(v.right || 'B')}</text></svg>
      <div class="cap2" id="${id}-vl">${md(v.label || '')}</div></div>`;
    els.push({ sel: `#${id}-c1`, at: v.left_at, kind: 'circ' }, { sel: `#${id}-c2`, at: v.right_at, kind: 'circ' },
              { sel: `#${id}-hi`, at: v.at, kind: 'vhi' }, { sel: `#${id}-vl`, at: v.at });
  } else if (t === 'bars') {
    const bars = (v.bars || []).slice(0, 5), max = Math.max(1, ...bars.map(x => Number(x.value) || 0));
    h += `<div class="bars" id="${id}-bs">` + bars.map((x, k) => `<div class="b"><div class="bv" id="${id}-bv${k}">${esc(x.value)}${esc(v.unit || '')}</div>` +
      `<div class="bb" id="${id}-bb${k}" data-h="${Math.round(560 * (Number(x.value) || 0) / max)}"></div><div class="bl">${esc(x.label)}</div></div>`).join('') + `</div>`;
    els.push({ sel: `#${id}-bs`, kind: 'box' });
    bars.forEach((x, k) => els.push({ sel: `#${id}-bb${k}`, at: x.at, kind: 'bar', k }));
  } else if (t === 'timeline') {
    const ev = (v.events || []).slice(0, 5), gap = ev.length > 1 ? Math.min(160, 540 / (ev.length - 1)) : 0;
    h += `<div class="tline" id="${id}-tl"><div class="tfill" id="${id}-tf"></div></div>`;
    ev.forEach((x, k) => { h += `<div class="tev" id="${id}-t${k}" style="top:${600 + k * gap - 50}px"><span class="nd" id="${id}-n${k}">${k + 1}</span><span>${md(x.text)}${x.note ? `<small>${md(x.note)}</small>` : ''}</span></div>`; });
    els.push({ sel: `#${id}-tl`, kind: 'box' });
    ev.forEach((x, k) => els.push({ sel: `#${id}-t${k}`, at: x.at, kind: 'tev', k, y: k * gap }));
  } else if (t === 'query') {
    const lines = (v.lines || []).slice(0, 8), ph = 84 + lines.length * 64 + 30, fs = fitFont(lines);
    h += `<div class="qpanel" id="${id}-qp"><div class="bar"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i>&nbsp;${esc(v.file || 'interview.sql')}</div>` +
      lines.map((l, k) => `<span class="ql" id="${id}-ql${k}"${fs}>${hl(l.code) || ' '}</span>`).join('') + `</div>`;
    els.push({ sel: `#${id}-qp`, kind: 'box' });
    lines.forEach((l, k) => {
      h += `<div class="qx" id="${id}-qx${k}" style="top:${560 + ph + 30}px"><span class="arr">L${k + 1} →</span>${md(l.explain || '')}</div>`;
      els.push({ sel: `#${id}-ql${k}`, at: l.at, kind: 'qline', k, n: lines.length });
    });
    if (v.output) { h += `<div class="qres" id="${id}-qr" style="top:${560 + ph + 30}px">▶ ${esc(v.output)}</div>`; els.push({ sel: `#${id}-qr`, at: v.output_at, kind: 'qres', n: lines.length }); }
  } else if (t === 'table') {
    const cols = (v.columns || []).slice(0, 4), rows = (v.rows || []).slice(0, 5), w = Math.floor(960 / Math.max(1, cols.length));
    h += `<div class="tb" id="${id}-tb"><div class="tr th">${cols.map(c => `<div style="width:${w}px">${esc(c)}</div>`).join('')}</div>` +
      rows.map((r, k) => `<div class="tr td${(v.highlight || []).includes(k) ? ' hi' : ''}" id="${id}-r${k}">${r.slice(0, cols.length).map(c => `<div style="width:${w}px">${esc(c)}</div>`).join('')}</div>`).join('') +
      `<div class="scan" id="${id}-sc"></div></div>`;
    els.push({ sel: `#${id}-tb`, kind: 'box' });
    rows.forEach((r, k) => els.push({ sel: `#${id}-r${k}`, at: (v.row_at || [])[k] || r[0], kind: 'row', k }));
  } else if (t === 'flow') {
    const steps = (v.steps || []).slice(0, 5), top0 = 590;
    const gap = steps.length > 1 ? Math.min(300, (1330 - top0 - 150) / (steps.length - 1)) : 0;  // fill the space
    steps.forEach((s, k) => {
      h += `<div class="fs" id="${id}-f${k}" style="top:${top0 + k * gap}px">${md(s.text)}</div>`;
      if (k < steps.length - 1) h += `<div class="fa" id="${id}-a${k}" style="top:${top0 + k * gap + 150}px;height:${gap - 150}px"></div>`;
      els.push({ sel: `#${id}-f${k}`, at: s.at, kind: 'step', k });
      if (k < steps.length - 1) els.push({ sel: `#${id}-a${k}`, kind: 'arrow' });
    });
  } else if (t === 'stat') {
    h += `<div class="st" id="${id}-s"><div class="num" id="${id}-n">0</div><div class="lab">${md(v.label || '')}</div><div class="barw"><div class="bar" id="${id}-b"></div></div></div>`;
    els.push({ sel: `#${id}-s`, at: v.at, kind: 'stat' });
  } else if (t === 'quiz') {
    h += `<div class="qz" id="${id}-qz"><div class="q">${md(v.question || '')}</div><div class="qm" id="${id}-qm">?</div></div>` +
      `<div class="qa w" id="${id}-qw"><span class="tg">ZYADATAR LOG BOLENGE</span>${md(v.wrong || '')}<i class="x" id="${id}-qx"></i></div>` +
      `<div class="qa r" id="${id}-qr"><span class="tg">✅ SAHI JAWAB</span>${md(v.right || '')}</div>`;
    els.push({ sel: `#${id}-qz`, at: v.q_at }, { sel: `#${id}-qw`, at: v.wrong_at, kind: 'qwrong' }, { sel: `#${id}-qr`, at: v.right_at, kind: 'qright' });
  } else if (t === 'cliff') {
    h += `<div class="cf" id="${id}-cf"><div class="tg">🤔 AGLA SAWAAL</div><div class="q">${md(v.question || '')}</div></div>` +
      `<div class="cta" id="${id}-cta"><span>Comment karo 👇 · Answer next reel mein</span></div>`;
    els.push({ sel: `#${id}-cf`, at: v.at }, { sel: `#${id}-cta`, at: v.cta_at, kind: 'cta' });
  } else if (t === 'compare') {
    const side = (x, c) => `<div class="cp ${c}" id="${id}-${c}"><div class="lb">${esc(x.label)}</div>` +
      (x.points || []).slice(0, 4).map((p, k) => `<div class="li" id="${id}-${c}${k}">→ ${md(p.text ?? p)}</div>`).join('') + `</div>`;
    h += side(v.left || {}, 'a') + `<div class="vs" id="${id}-vs">VS</div>` + side(v.right || {}, 'b');
    els.push({ sel: `#${id}-a`, at: (v.left || {}).at });
    ((v.left || {}).points || []).slice(0, 4).forEach((p, k) => els.push({ sel: `#${id}-a${k}`, at: p.at }));
    els.push({ sel: `#${id}-vs`, kind: 'vs' }, { sel: `#${id}-b`, at: (v.right || {}).at });
    ((v.right || {}).points || []).slice(0, 4).forEach((p, k) => els.push({ sel: `#${id}-b${k}`, at: p.at }));
  } else if (t === 'chat') {
    h += `<div class="chat" id="${id}-ch"><div class="hd">👩‍💻 ${esc(v.name || 'SQL doubts')} <i>● online</i></div>` +
      (v.messages || []).slice(0, 5).map((m, k) => `<span class="msg ${m.side === 'r' ? 'r' : 'l'}" id="${id}-m${k}">${md(m.text)}</span>`).join('') + `</div>`;
    els.push({ sel: `#${id}-ch`, kind: 'box' });
    (v.messages || []).slice(0, 5).forEach((m, k) => els.push({ sel: `#${id}-m${k}`, at: m.at, kind: 'msg' }));
  } else if (t === 'checklist') {
    (v.items || []).slice(0, 5).forEach((it, k) => {
      h += `<div class="ck" id="${id}-c${k}" style="top:${560 + k * 140}px"><span class="box" id="${id}-x${k}"><span>✓</span></span><span>${md(it.text)}</span></div>`;
      els.push({ sel: `#${id}-c${k}`, at: it.at, kind: 'check', k });
    });
  }
  add(h + `</div>`);
});

Reel.build(R2 => {
  const { master, B, P: lead } = R2;
  gsap.set(['#wipe', '#wipe2'], { xPercent: -120, skewX: -12 });
  R.beats.forEach((b, bi) => {
    const bt = B[b.id], start = lead(bt.start), end = lead(bt.end), words = bt.words, info = V[b.id];
    const first = start + 0.25, last = Math.max(first + 0.4, end - 0.55);
    let from = 0;
    const find = at => {
      const k = norm(at || ''); if (k.length < 2) return null;
      for (let w = from; w < words.length; w++) { const x = norm(words[w].w); if (x === k || (k.length >= 4 && (x.startsWith(k.slice(0, 4)) && k.startsWith(x.slice(0, 4))))) { from = w + 1; return lead(words[w].t) - 0.1; } }
      return null;
    };
    const els = info.els;
    els.forEach(e => { e.t = e.kind === 'box' ? first - 0.1 : find(e.at); });
    for (let k = 0; k < els.length; k++) {          // unmatched -> evenly between neighbours
      if (els[k].t != null) continue;
      let a = k - 1; while (a >= 0 && els[a].t == null) a--;
      let z = k + 1; while (z < els.length && els[z].t == null) z++;
      const ta = a >= 0 ? els[a].t : first, tz = z < els.length ? els[z].t : last;
      els[k].t = ta + (tz - ta) * (k - a) / (z - a);
    }
    for (let k = 1; k < els.length; k++) els[k].t = Math.max(els[k].t, els[k - 1].t + 0.06);
    els.forEach(e => e.t = Math.min(Math.max(e.t, first - 0.1), end - 0.45));

    if (bi === 0) R2.hdrIn(b.id, lead(0) - 0.35); else R2.hdrIn(b.id);
    const sels = els.map(e => e.sel);
    els.forEach(e => {
      const at = e.t;
      if (e.kind === 'word') { gsap.set(e.sel, { opacity: 0, y: 60, rotate: 6 }); master.to(e.sel, { opacity: 1, y: 0, rotate: 0, duration: 0.3, ease: 'back.out(2.2)' }, at); }
      else if (e.kind === 'line') {
        master.set(e.sel, { opacity: 1 }, at);
        master.to(e.sel, { clipPath: 'inset(0 0% 0 0)', duration: Math.min(1.1, Math.max(0.35, e.n * 0.045)), ease: `steps(${Math.max(4, e.n)})` }, at);
        master.to(`#${b.id}-hl`, { opacity: 1, top: 88 + e.k * 62, duration: 0.25, ease: 'power2.out' }, at);
      }
      else if (e.kind === 'out') { master.to(`#${b.id}-run`, { scale: 1.25, backgroundColor: '#5CFFB0', duration: 0.15, yoyo: true, repeat: 1 }, at - 0.2); gsap.set(e.sel, { opacity: 0, y: 20 }); master.to(e.sel, { opacity: 1, y: 0, duration: 0.4 }, at); }
      else if (e.kind === 'circ') { gsap.set(e.sel, { opacity: 0, scale: 0.6, transformOrigin: '50% 50%' }); master.to(e.sel, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2)' }, at); }
      else if (e.kind === 'vhi') { master.to(e.sel, { opacity: 0.85, duration: 0.35 }, at); master.to(e.sel, { opacity: 0.55, duration: 0.5, yoyo: true, repeat: 3 }, at + 0.4); }
      else if (e.kind === 'bar') {
        const hgt = +document.querySelector(e.sel).dataset.h;
        master.to(e.sel, { height: hgt, duration: 0.6, ease: 'back.out(1.4)' }, at);
        master.to(`#${b.id}-bv${e.k}`, { opacity: 1, duration: 0.3 }, at + 0.35);
      }
      else if (e.kind === 'tev') {
        gsap.set(e.sel, { opacity: 0, x: 60 }); master.to(e.sel, { opacity: 1, x: 0, duration: 0.35, ease: 'expo.out' }, at);
        master.to(`#${b.id}-n${e.k}`, { borderColor: ACC, backgroundColor: ACC, color: '#0B0716', duration: 0.25 }, at + 0.1);
        master.to(`#${b.id}-tf`, { height: e.y + 10, duration: 0.35, ease: 'power2.out' }, at);
      }
      else if (e.kind === 'qline') {
        master.to(e.sel, { opacity: 1, borderLeftColor: '#3DF5FF', backgroundColor: 'rgba(61,245,255,.10)', duration: 0.2 }, at);
        if (e.k > 0) master.to(`#${b.id}-ql${e.k - 1}`, { opacity: 0.55, borderLeftColor: 'rgba(0,0,0,0)', backgroundColor: 'rgba(0,0,0,0)', duration: 0.2 }, at);
        gsap.set(`#${b.id}-qx${e.k}`, { opacity: 0, y: 20 });
        master.to(`#${b.id}-qx${e.k}`, { opacity: 1, y: 0, duration: 0.3, ease: 'back.out(2)' }, at + 0.05);
        if (e.k > 0) master.to(`#${b.id}-qx${e.k - 1}`, { opacity: 0, duration: 0.15 }, at);
      }
      else if (e.kind === 'qres') {
        master.to(`#${b.id}-ql${e.n - 1}`, { opacity: 0.55, borderLeftColor: 'rgba(0,0,0,0)', backgroundColor: 'rgba(0,0,0,0)', duration: 0.2 }, at);
        master.to(`[id^="${b.id}-ql"]`, { opacity: 1, duration: 0.3 }, at);
        master.to(`[id^="${b.id}-qx"]`, { opacity: 0, duration: 0.15 }, at);
        gsap.set(e.sel, { opacity: 0, scale: 0.9 }); master.to(e.sel, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' }, at + 0.1);
      }
      else if (e.kind === 'row') {
        gsap.set(e.sel, { opacity: 0, x: -80 }); master.to(e.sel, { opacity: 1, x: 0, duration: 0.35, ease: 'expo.out' }, at);
        master.to(`#${b.id}-sc`, { opacity: 1, top: 70 + e.k * 92, duration: 0.3, ease: 'power2.out' }, at);
      }
      else if (e.kind === 'step') {
        gsap.set(e.sel, { opacity: 0, scale: 0.7 }); master.to(e.sel, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, at);
        master.to(e.sel, { borderColor: ACC, boxShadow: `0 0 50px ${ACC}66`, duration: 0.2 }, at + 0.1);
        if (e.k > 0) master.to(`#${b.id}-f${e.k - 1}`, { borderColor: 'rgba(139,124,255,.6)', boxShadow: '0 0 0 rgba(0,0,0,0)', duration: 0.25 }, at + 0.1);
        if (e.k > 0) master.to(`#${b.id}-a${e.k - 1}`, { backgroundColor: ACC, duration: 0.25 }, at - 0.1);
      }
      else if (e.kind === 'arrow') { gsap.set(e.sel, { scaleY: 0, transformOrigin: '50% 0' }); master.to(e.sel, { scaleY: 1, duration: 0.3 }, at); }
      else if (e.kind === 'stat') {
        const v = info.v, to = Number(String(v.value).replace(/[^\d.]/g, '')) || 0, d = Math.max(1.2, last - at - 0.3);
        gsap.set(e.sel, { opacity: 0, scale: 0.8 }); master.to(e.sel, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, at);
        R2.counter(`#${b.id}-n`, 0, to, at, d, n => (v.prefix || '') + Math.round(n).toLocaleString('en-IN') + (v.suffix || ''));
        master.to(`#${b.id}-b`, { width: '100%', duration: d, ease: 'power2.out' }, at);
      }
      else if (e.kind === 'msg') {
        gsap.set(e.sel, { opacity: 0, y: 30, scale: 0.9 }); master.to(e.sel, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: 'back.out(2)' }, at);
      }
      else if (e.kind === 'check') {
        gsap.set(e.sel, { opacity: 0, x: 60 }); master.to(e.sel, { opacity: 1, x: 0, duration: 0.35, ease: 'expo.out' }, at - 0.15);
        master.to(`#${b.id}-x${e.k}`, { backgroundColor: ACC, duration: 0.15 }, at + 0.25);
        master.to(`#${b.id}-x${e.k} span`, { opacity: 1, scale: 1.3, duration: 0.2, yoyo: true, repeat: 1 }, at + 0.25);
      }
      else if (e.kind === 'vs') { gsap.set(e.sel, { opacity: 0, scale: 0, rotate: -90 }); master.to(e.sel, { opacity: 1, scale: 1, rotate: 0, duration: 0.5, ease: 'back.out(3)' }, at); }
      else if (e.kind === 'qwrong') {
        gsap.set(e.sel, { opacity: 0, x: -80 }); master.to(e.sel, { opacity: 1, x: 0, duration: 0.35, ease: 'expo.out' }, at);
        master.to(`#${b.id}-qm`, { scale: 1.25, duration: 0.25, yoyo: true, repeat: 3, ease: 'sine.inOut' }, at);
      }
      else if (e.kind === 'qright') {
        master.to(`#${b.id}-qx`, { scaleX: 1, duration: 0.25, ease: 'power2.out' }, at - 0.15);
        master.to(`#${b.id}-qw`, { opacity: 0.45, x: -12, duration: 0.08, yoyo: true, repeat: 3 }, at - 0.15);
        master.to(`#${b.id}-qm`, { opacity: 0, duration: 0.2 }, at);
        gsap.set(e.sel, { opacity: 0, scale: 0.7 }); master.to(e.sel, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2.4)' }, at);
        master.to(e.sel, { boxShadow: '0 0 70px rgba(92,255,176,.55)', duration: 0.3 }, at + 0.2);
      }
      else if (e.kind === 'cta') {
        gsap.set(e.sel, { opacity: 0, y: 40 }); master.to(e.sel, { opacity: 1, y: 0, duration: 0.4, ease: 'back.out(2)' }, at);
        master.to(`${e.sel} span`, { scale: 1.08, duration: 0.35, yoyo: true, repeat: 5, ease: 'sine.inOut' }, at + 0.4);
      }
      else { gsap.set(e.sel, { opacity: 0, y: 40, scale: 0.95 }); R2.popIn(e.sel, at); }
    });
    from = 0;
    (b.cues || []).forEach((c, ci) => {
      let at = find(c.word); if (at == null) return;
      at = Math.min(at + 0.05, end - 0.6);
      const target = els.filter(e => !['box', 'arrow', 'vs'].includes(e.kind))[(parseInt(c.target) || 0) - 1];
      if (c.do === 'kinetic') {
        const kid = `${b.id}-q${ci}`;
        add(`<div class="kin ${['', 'p', 'c'][ci % 3]}" id="${kid}">${esc(String(c.target || c.word).slice(0, 16))}</div>`);
        master.fromTo(`#${kid}`, { opacity: 0, scale: 0.4, rotate: -14 }, { opacity: 1, scale: 1, rotate: -4, duration: 0.35, ease: 'back.out(2.5)', immediateRender: false }, at);
        master.to(`#${kid}`, { opacity: 0, scale: 1.25, duration: 0.25, ease: 'power2.in' }, at + 1.0);
      } else if (c.do === 'emoji') {
        const kid = `${b.id}-q${ci}`;
        add(`<div class="burst" id="${kid}" style="left:${800 - (ci % 2) * 120}px;top:${1180 + (ci % 2) * 40}px">${esc(String(c.target || '🔥').slice(0, 4))}</div>`);
        master.fromTo(`#${kid}`, { opacity: 0, scale: 0.2, y: 40 }, { opacity: 1, scale: 1.2, y: 0, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, at);
        master.to(`#${kid}`, { opacity: 0, y: -160, rotate: 25, duration: 0.8, ease: 'power1.in' }, at + 0.5);
      } else if (c.do === 'flash') {
        master.fromTo('#flash', { opacity: 0.25 }, { opacity: 0, duration: 0.18, immediateRender: false }, at);
      } else if (target && c.do === 'shake') {
        master.to(target.sel, { keyframes: [{ x: -16 }, { x: 14 }, { x: -10 }, { x: 8 }, { x: 0 }], duration: 0.45 }, at);
      } else if (target && (c.do === 'zoom' || c.do === 'highlight' || c.do === 'pop')) {
        master.to(target.sel, { scale: 1.1, duration: 0.22, ease: 'power3.out' }, at);
        master.to(target.sel, { scale: 1, duration: 0.35, ease: 'power2.inOut' }, at + 0.7);
      }
    });
    if (bi < R.beats.length - 1) { R2.hdrOut(b.id); master.to(info.root, { opacity: 0, y: -40, duration: 0.3, ease: 'power2.in' }, end - 0.3); }
    if (bi > 0) {
      gsap.set(info.root, { opacity: 1 });
      master.fromTo('#wipe2', { xPercent: -120 }, { xPercent: 120, duration: 0.42, ease: 'power3.inOut', immediateRender: false }, start - 0.3);
      master.fromTo('#wipe', { xPercent: -120 }, { xPercent: 120, duration: 0.42, ease: 'power3.inOut', immediateRender: false }, start - 0.24);
    }
  });
  R2.everyFrame(t => {
    R.beats.forEach((b, bi) => { const el = document.getElementById(`v-${b.id}`); if (el) el.style.translate = `0 ${Math.sin(t * 1.6 + bi) * 8}px`; });
    const e = document.getElementById(`${R.beats[0].id}-e`); if (e) e.style.rotate = `${Math.sin(t * 3) * 8}deg`;
    document.querySelectorAll('.vs').forEach(d => d.style.rotate = `${Math.sin(t * 2) * 6}deg`);
    document.getElementById('prog').style.width = `${Math.min(100, 100 * t / TL.duration)}%`;
  });
});
</script>
</body></html>
