name: Generate loop

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many new posts this run makes"
        required: false
        default: "1"

permissions:
  contents: write
  actions: write
  issues: write
  models: read

concurrency:
  group: generate-loop
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GH_MODELS_TOKEN: ${{ github.token }}
      REEL_VOICE: gemini
      REEL_TONE: "Talk like a Gen Z desi Indian tech creator explaining to a friend: casual, energetic Roman Hinglish, short punchy lines, words like bro, scene kya hai, literally, no cap, full on, but every line still teaches the topic clearly and correctly. Keep the whole voiceover 55-70 seconds."
      MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Wait until 5 hours after the last topic
        if: ${{ github.actor == 'github-actions[bot]' }}
        run: |
          last=$(cat scheduler/last_generated.txt 2>/dev/null || echo 0)
          left=$(( last + 18000 - $(date +%s) ))
          if [ "$left" -gt 0 ]; then echo "Next topic in $(( left / 60 )) min"; sleep "$left"; fi
          git pull -q --rebase

      - name: Install renderer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg
          pip install requests playwright edge-tts
          python -m playwright install --with-deps chromium

      - name: Make the post, then the reel, then upload both
        continue-on-error: true
        run: python -u generator/generate.py --count "${{ inputs.count || '1' }}"

      - name: Save
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date +%s > scheduler/last_generated.txt
          git add scheduler/last_generated.txt scheduler/carousels.json scheduler/sql_reel_posts.csv generator/content generator/topics.csv
          git diff --cached --quiet && exit 0
          git commit -m "Generated new posts"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1

      - name: Watchdog (health checks + safe auto-fixes)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_REPO_TOKEN: ${{ secrets.YT_REPO_TOKEN }}
        run: |
          pip install -q requests
          python -u scheduler/watchdog.py

      - name: Start the next loop run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run generate_loop.yml --ref main
