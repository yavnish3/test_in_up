name: Generate loop

# Own self-restarting loop: every ~4.5 hours one new topic is generated: a carousel and a
# reel on the same topic (Gemini writes, Playwright renders, Neerja voice), saved to
# Cloudinary + carousels.json / sql_reel_posts.csv for the Carousel and Reel loops.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many new posts this run makes"
        required: false
        default: "1"

permissions:
  contents: write
  actions: write       # start the next run of this workflow
  models: read         # GitHub Models as a backup writer

concurrency:
  group: generate-loop
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GH_MODELS_TOKEN: ${{ github.token }}   # GitHub Models (needs permissions: models: read)
      MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - name: Note start time
        run: echo "LOOP_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install renderer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg
          pip install requests playwright edge-tts
          python -m playwright install --with-deps chromium

      - name: Generate
        continue-on-error: true   # a Gemini hiccup must not stop the loop
        run: python -u generator/generate.py --count "${{ inputs.count || '1' }}"

      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scheduler/carousels.json scheduler/sql_reel_posts.csv generator/content generator/topics.csv
          git diff --cached --quiet && exit 0
          git commit -m "Generated new posts"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1

      - name: Wait for the next post (run lasts ~4.5 hours in total)
        if: ${{ !cancelled() }}
        run: |
          left=$(( 16200 - ($(date +%s) - LOOP_START) ))
          echo "Sleeping $(( left / 60 )) min"
          [ "$left" -gt 0 ] && sleep "$left" || true

      - name: Start the next loop run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run generate_loop.yml --ref main
