name: Carousel loop

on:
  workflow_dispatch:   # start it once by hand; after that it restarts itself
    inputs:
      post_now:
        description: "Post one carousel right away when this run starts, then continue on schedule"
        type: choice
        options: ["no", "yes"]
        default: "no"

permissions:
  contents: write      # save posted CSVs
  actions: write       # start the next run of this workflow

concurrency:
  group: carousel-loop
  cancel-in-progress: false   # only one loop at a time

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r scheduler/requirements.txt

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Wait for the next posting time and post once
        working-directory: scheduler
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          POST_NOW: ${{ inputs.post_now || 'no' }}
          LOOP_KIND: carousel
        run: python -u loop_runner.py

      - name: Start the next loop run
        if: ${{ !cancelled() && hashFiles('scheduler/.loop_done_carousel') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run carousel_loop.yml --ref main
