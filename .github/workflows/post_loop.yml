name: Post loop

on:
  workflow_dispatch:   # start it once by hand; after that it restarts itself
    inputs:
      test_post_in_minutes:
        description: "Test: post the next carousel after this many minutes (0 = normal schedule only)"
        required: false
        default: "0"

permissions:
  contents: write      # save posted CSVs
  actions: write       # start the next run of this workflow

concurrency:
  group: post-loop
  cancel-in-progress: false   # only one loop at a time

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r scheduler/requirements.txt

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Post at the scheduled times (about 5.5 hours)
        working-directory: scheduler
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          TEST_POST_IN_MINUTES: ${{ inputs.test_post_in_minutes }}
        run: python -u loop_runner.py

      - name: Start the next loop run
        if: ${{ !cancelled() && hashFiles('scheduler/.loop_done') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run post_loop.yml --ref main
